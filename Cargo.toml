[package]
name = "symbios-avatar"
version = "0.8.0"
edition = "2024"
authors = ["Janus"]
description = "Engine-agnostic parametric avatar engine: procedural humanoid and creature bodies from small records."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/symbios-avatar"
keywords = ["avatar", "procedural", "character", "mesh", "generative"]
categories = ["simulation", "game-development", "graphics"]
# Test targets are declared, not discovered (#332).
#
# Every `tests/*.rs` used to be a `[[test]]` target of its own — fifteen
# binaries, each a separate codegen and link of everything it pulls from the
# crate, now at opt-level 3. They are modules of one `integration` harness
# instead; see `tests/main.rs` for the rule that comes with that and what it
# changes about running them.
autotests = false

# docs.rs builds with every feature on, so the feature-gated API is documented.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Embeds `assets/clips.bin` in the binary and turns on `ClipLibrary::builtin`.
#
# **For development, not for shipping.** Runtime motion is procedural; the
# baked set is a comparison reference — a second opinion when a procedural
# motion looks wrong. It is a poor gold standard and `docs/clips.md` says so
# with numbers: six of its eight loops pause for a frame at the wrap, and two
# of its one-shots move a body six and twenty-four times their own median step
# between two frames.
#
# **Off by default, and that is the whole reason it is a feature.** The artifact
# is 200 KiB and a consumer that only builds bodies should not carry it — least
# of all a wasm one, where every byte of the library is a byte of the download.
# A consumer that wants the clips says so; one that would rather fetch the file
# at run time reads it with `ClipLibrary::read` and pays nothing here.
builtin-clips = []
# Makes a **built** `Avatar` serialisable, so one can cross a process or
# worker boundary (wasm task pools run on the main thread, so a body has to be
# built in a Web Worker and sent back).
#
# Off by default because it is a contract, not a convenience. A round-tripped
# `Avatar` is **drawable, not rebuildable**: `Parts` carries its measured
# surface, its eyes and its handedness, and drops the intermediates the merge
# was made from (the un-charted body mesh, the weights, the zone list, the
# unwrap, the face features, the hair growth, the extremities, the outfit and
# the mouth). Those exist so a caller can ask how the body was made; nothing
# that DRAWS one reads them, and carrying them would roughly double a payload
# already dominated by an atlas.
serde-avatar = ["dep:serde_bytes"]

[dependencies]
glam = { version = "0.32", features = ["serde"] }
# The anim path's transcendentals route through `det`, not the platform libm:
# Rust documents f32::sin/cos/powf/exp as platform-dependent, and #323 measured
# the same deterministic stop reading 25.4/35.2/50.1 mm on three builds of the
# same source. Pure Rust, same bits on every target, wasm included.
libm = "0.2"
# Skin detail must be sampled in *body* space, not atlas space, or every chart
# boundary shows a seam — which needs 3-D noise. Same version symbios-texture
# already pulls in, so no new entry in the tree.
noise = "0.9"
# Default features off: this crate never asks for OS entropy. Every draw comes
# from a seeded `Pcg64Mcg`, which is what makes a record reproduce the same body
# on every machine, so `thread_rng` and `os_rng` are surface it does not want.
rand = { version = "0.9", default-features = false }
rand_pcg = "0.9"
serde = { version = "1.0", features = ["derive", "rc"] }
# Only for `serde-avatar`: an atlas is megabytes, and a self-describing codec
# writes a per-element tag for a plain `Vec<u8>`. Opaque `bin` is one header.
serde_bytes = { version = "0.11", optional = true }
# Records are JSON on the wire, and their serialised size is the budget this
# crate holds itself to — so the serialiser is a runtime dependency, not a
# test-only one.
serde_json = "1.0"
# Procedural-generation primitives — noise fields, cosine palettes, the
# TextureMap pixel container, and height-to-normal conversion — shared with the
# rest of the symbios ecosystem rather than reimplemented here.
symbios-texture = "0.7"
thiserror = "2.0.17"

[dev-dependencies]
# Examples only — writing atlas PNGs to look at. The library itself emits raw
# pixel buffers and never encodes an image.
image = { version = "0.25", default-features = false, features = ["png"] }

# The one integration-test target. Every file under `tests/` is a `mod` of
# `tests/main.rs`; nextest still runs every test in its own process, so
# parallelism and isolation are unchanged there — plain `cargo test` shares
# one process across them, which the header of that file is about.
[[test]]
name = "integration"
path = "tests/main.rs"

# The test profile, measured (#332).
#
# There was no `[profile]` section here at all, so CI's bare `cargo test` ran
# the suite at opt-level 0, and this crate's tests build whole bodies: about a
# hundred face, hair and budget tests carried 95% of a 247 serial-CPU-minute
# run, at a measured 27-50x penalty against release (the worst single test,
# `the_eye_opens_on_the_gaze`, 568.6 s debug against 13.0 s release). On a
# 4-vCPU runner that is the CI hour, per matrix entry, before compile.
#
# Same suite, same bare-`cargo test` semantics, with release codegen:
# 247 -> 24 CPU-minutes, a 75 s run behind a 1m16s crate compile, all 895
# green — the `det` goldens and locomotion digests included, because IEEE ops
# do not change with opt level and rustc keeps strict FP.
#
# `debug-assertions` and `overflow-checks` stay ON, because `test` inherits
# `dev`. That is overlands' #1147 lesson mirrored: their `test-release` adds
# assertions to release codegen; this adds release codegen to the asserting
# profile. Two gates that disagree about what the code asserts is worse than
# one slow gate.
#
# The `"*"` line reaches dependencies only — cargo's glob never matches the
# workspace member — so glam, noise and the rest are optimised under every
# dev-profile build too (the examples' bodies get faster for free), while
# this crate's own dev codegen is untouched. The `render` instrument still
# wants `--release`, for the crate's own code.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
