[package]
name = "symbios-avatar"
version = "0.1.0"
edition = "2024"
authors = ["Janus"]
description = "Engine-agnostic parametric avatar engine: procedural humanoid and creature bodies from small records."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/symbios-avatar"
keywords = ["avatar", "procedural", "character", "mesh", "generative"]
categories = ["simulation", "game-development", "graphics"]

[features]
default = []
# Embeds `assets/clips.bin` in the binary and turns on `ClipLibrary::builtin`.
#
# **For development, not for shipping** (#249). The baked set was the runtime
# motion source when it was imported; epic #237 replaced locomotion with the
# procedural layer and #248 re-authored the expressive roster in goal space, so
# what the artifact is for now is comparison — a second opinion when a
# procedural motion looks wrong. It is a poor gold standard and `docs/clips.md`
# says so with numbers: six of its eight loops pause for a frame at the wrap,
# and two of its one-shots move a body six and twenty-four times their own
# median step between two frames.
#
# **Off by default, and that is the whole reason it is a feature.** The artifact
# is 200 KiB and a consumer that only builds bodies should not carry it — least
# of all a wasm one, where every byte of the library is a byte of the download.
# A consumer that wants the clips says so; one that would rather fetch the file
# at run time reads it with `ClipLibrary::read` and pays nothing here.
builtin-clips = []
# Makes a **built** [`Avatar`] serialisable, so one can cross a process or
# worker boundary (symbios-avatar#234, for overlands#1061: wasm task pools run
# on the main thread, so a body has to be built in a Web Worker and sent back).
#
# Off by default because it is a contract, not a convenience. A round-tripped
# `Avatar` is **drawable, not rebuildable**: `Parts` carries its measured
# surface, its eyes and its handedness, and drops the intermediates the merge
# was made from (the un-charted body mesh, the weights, the zone list, the
# unwrap, the face features, the hair growth, the extremities, the outfit and
# the mouth). Those exist so a caller can ask how the body was made; nothing
# that DRAWS one reads them, and carrying them would roughly double a payload
# already dominated by an atlas.
serde-avatar = ["dep:serde_bytes"]

[dependencies]
glam = { version = "0.30.10", features = ["serde"] }
# Skin detail must be sampled in *body* space, not atlas space, or every chart
# boundary shows a seam — which needs 3-D noise. Same version symbios-texture
# already pulls in, so no new entry in the tree.
noise = "0.9"
# Default features off: this crate never asks for OS entropy. Every draw comes
# from a seeded `Pcg64Mcg`, which is what makes a record reproduce the same body
# on every machine, so `thread_rng` and `os_rng` are surface it does not want.
rand = { version = "0.9", default-features = false }
rand_pcg = "0.9"
serde = { version = "1.0", features = ["derive", "rc"] }
# Only for `serde-avatar`: an atlas is megabytes, and a self-describing codec
# writes a per-element tag for a plain `Vec<u8>`. Opaque `bin` is one header.
serde_bytes = { version = "0.11", optional = true }
# Records are JSON on the wire, and their serialised size is the budget this
# crate holds itself to — so the serialiser is a runtime dependency, not a
# test-only one.
serde_json = "1.0"
# Procedural-generation primitives — noise fields, cosine palettes, the
# TextureMap pixel container, and height-to-normal conversion — shared with the
# rest of the symbios ecosystem rather than reimplemented here.
symbios-texture = "0.4"
thiserror = "2.0.17"

# Browsers are the first platform this engine ships to, and `getrandom` refuses
# to build for `wasm32-unknown-unknown` unless it is told where entropy comes
# from. Nothing here wants entropy — see the note on `rand` above — but
# `symbios-texture` pulls `rand` with its defaults on and Cargo unifies features
# across the graph, so the requirement arrives anyway.
#
# Declared here rather than left to the consumer because it is half of a
# two-part answer: the feature turns the backend on, and `.cargo/config.toml`
# carries the `--cfg` that selects it. A consuming application still needs the
# second half; getting the first for free is one less way to be stuck.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# Examples only — writing atlas PNGs to look at. The library itself emits raw
# pixel buffers and never encodes an image.
image = { version = "0.25", default-features = false, features = ["png"] }
